version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - gosec
    - govet
    - revive
    - staticcheck
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: context-as-argument
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: indent-error-flow
        - name: var-naming
  exclusions:
    rules:
      # Test code may assert on unchecked returns and use weak randomness.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
