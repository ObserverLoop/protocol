# The event registry — the one source of truth.
#
# This is the only hand-written enumeration in the repository. Event type
# constants, subject builders, JetStream stream specifications, the trust-domain
# and capability authorisation tables, and the conformance manifest are all
# generated from this file by cmd/protoc-registry. Adding an event type is one
# entry here plus one schema file plus one fixture; nothing else is hand-edited.
#
# `version` is the protocol MAJOR.MINOR. The subject root carries MAJOR only.
#
# 1.1 added tool.call and tool.result. Adding an event type is additive: an
# unknown MINOR is accepted, and an unknown event type is retained but acted on
# by nobody, so a 1.0 consumer is unaffected.
#
# 1.2 made permission.resolved's actor one of two shapes, adding a signing-key
# variant beside the attested human. Also additive: the attested shape is
# unchanged and still validates, and the new shape is one a 1.1 consumer would
# have rejected as an actor it could not read rather than misread as one it
# could.
#
# 1.3 gave permission.requested a bounded, redacted `arguments` string, with
# `arguments_truncated` and the payload-level `redacted` flag beside it. Before
# it, the only publishable description of a held call was a tool name and a
# target, and a human shown "bash command=rm" could not tell `rm -rf /tmp/x`
# from `rm -rf /`. Additive: the three fields are optional, a 1.2 consumer
# ignores them, and the unbounded `tool_input` it may have expected is
# unchanged, still declared, and still never populated.
#
# 1.4 added `idle` to agent.lifecycle's state enum. Every other state in that
# list describes the process behind an agent — it is starting, it is running, it
# has stopped — which was the whole vocabulary a producer needed while an agent
# and the process running it began and ended together. An agent that outlives the
# turn it was started for has a state none of them fits: it has finished a turn,
# its process is still there, and it is waiting for the next message. `stopped`
# would claim an exit that has not happened, and `running` would leave a consumer
# reading the thread as busy.
#
# Additive, with one thing worth saying plainly. A consumer that switches on the
# enum and treats an unrecognised state as informational is unaffected, which is
# the documented rule for an unknown MINOR. A consumer that derives "the turn is
# over" from `stopped` alone will, against a producer that emits `idle`, see a
# turn that never ends — so a 1.3 consumer is compatible with a 1.4 producer only
# for as long as that producer does not keep agents alive between turns. That is
# a property of the deployment, not of the schema, and it is why this is a MINOR
# rather than a patch.
# 1.5 added the query pair: query.request and query.result. Until it, a client
# could write and could follow, and could not ask. The threads of a workspace,
# the interactions waiting for a human, and the messages of one thread were
# reachable only by consuming the event stream from its beginning — so every
# client rebuilt every thread from a ninety-day retention window at every start,
# and a client that could not read the deployment's own database could not learn
# what the deployment was running.
#
# The pair is core rather than jetstream, and the topology enforces that rather
# than documenting it: neither subject class is named by a stream, and the
# generator refuses a jetstream event on an unbound class. A read is
# request-scoped. Retaining answers would write the same events a second time,
# inside the stream that already holds them, once for every client that ever
# scrolled — and redelivering yesterday's answer to "what is in this thread" is
# worse than no answer.
#
# thread.history answers with the envelopes as they were published, rather than
# with rows read out of a projection. The client verifies each one exactly as it
# verifies what arrives on the stream, so history obtained by asking is the same
# evidence as history obtained by following. The other kinds cannot do that and
# do not pretend to: a thread's state, the pending interactions, and what the
# daemon is running are the responder's own account, signed by the responder.
#
# Additive in both directions that matter. A 1.4 consumer subscribes to neither
# subject and is unaffected, and the two new capabilities are held by no existing
# key, so nothing accepted today is refused tomorrow. The one thing to say
# plainly: a 1.4 producer cannot answer, and because the reply is core there is
# no delivery machinery to report that. A 1.5 client hears "this deployment does
# not serve queries" and "the daemon is not there" as the same silence, and must
# not present the second as the first.
version: "1.5"

# A subject class is a template. Every token in braces is a validated identifier
# (protocol.ParseIdentifier), except {type}, which is the registry type token and
# is therefore the only token that may contain a dot. {type} is always last.
subject_classes:
  thread: ol.v1.tenant.{tenant_id}.workspace.{workspace_id}.thread.{thread_id}.event.{type}
  conductor_command: ol.v1.tenant.{tenant_id}.workspace.{workspace_id}.conductor.{conductor_id}.command.{type}
  conductor_result: ol.v1.tenant.{tenant_id}.workspace.{workspace_id}.conductor.{conductor_id}.result.{command_id}.{type}
  audit: ol.v1.tenant.{tenant_id}.workspace.{workspace_id}.audit.{type}
  # The read pair. Keyed by the request's own identifier, as conductor_result is
  # keyed by the command's, so a client subscribes to the reply it is about to
  # ask for and needs no inbox convention of its own. Named by no stream, which
  # is what makes them core.
  conductor_query: ol.v1.tenant.{tenant_id}.workspace.{workspace_id}.conductor.{conductor_id}.query.{type}
  conductor_query_result: ol.v1.tenant.{tenant_id}.workspace.{workspace_id}.conductor.{conductor_id}.query_result.{query_id}.{type}

# Stream subject bindings are derived from the subject classes, never written by
# hand. The generator substitutes tenant and workspace, replaces every other
# interpolated token with a single-token wildcard, and replaces the trailing
# {type} with a multi-token wildcard. `name` is suffixed with the workspace.
#
# A subject class named by no stream carries only `durability: core` events.
streams:
  - name: OL_EVENTS
    subject_classes: [thread, audit, conductor_result]
    retention: limits
    max_age: 2160h # 90 days
    discard: old
    duplicate_window: 2h
  - name: OL_COMMANDS
    subject_classes: [conductor_command]
    retention: workqueue
    max_age: 24h
    discard: old
    duplicate_window: 2h

events:
  - type: agent.lifecycle
    schema: schemas/payload/agent.lifecycle.json
    subject_class: thread
    durability: jetstream
    trust_domains: [tenant]
    capabilities: [agent.lifecycle]

  - type: audit.incident
    schema: schemas/payload/audit.incident.json
    subject_class: audit
    durability: jetstream
    trust_domains: [tenant]
    capabilities: [audit.write]

  - type: audit.schema
    schema: schemas/payload/audit.schema.json
    subject_class: audit
    durability: jetstream
    trust_domains: [tenant]
    capabilities: [audit.write]

  - type: audit.security
    schema: schemas/payload/audit.security.json
    subject_class: audit
    durability: jetstream
    trust_domains: [tenant]
    capabilities: [audit.write]

  - type: audit.signature
    schema: schemas/payload/audit.signature.json
    subject_class: audit
    durability: jetstream
    trust_domains: [tenant]
    capabilities: [audit.write]

  - type: chat.message
    schema: schemas/payload/chat.message.json
    subject_class: thread
    durability: jetstream
    trust_domains: [tenant, saas-attested]
    capabilities: [thread.write]

  # The SaaS attestation key may issue commands on behalf of an authenticated
  # human; the envelope then carries payload.actor.
  - type: command.requested
    schema: schemas/payload/command.requested.json
    subject_class: conductor_command
    durability: jetstream
    trust_domains: [tenant, saas-attested]
    capabilities: [command.issue]

  # Core, not JetStream: the JetStream topology binds no stream to
  # conductor.*.result.>. A result is a request-scoped reply; the durable record
  # of what happened is the thread and audit event stream.
  - type: command.result
    schema: schemas/payload/command.result.json
    subject_class: conductor_result
    durability: jetstream
    trust_domains: [tenant]
    capabilities: [command.execute]

  - type: decision.record
    schema: schemas/payload/decision.record.json
    subject_class: thread
    durability: jetstream
    trust_domains: [tenant]
    capabilities: [thread.write]

  - type: permission.requested
    schema: schemas/payload/permission.requested.json
    subject_class: thread
    durability: jetstream
    trust_domains: [tenant]
    capabilities: [interaction.request]

  - type: permission.resolved
    schema: schemas/payload/permission.resolved.json
    subject_class: thread
    durability: jetstream
    trust_domains: [tenant, saas-attested]
    capabilities: [interaction.resolve]

  - type: question.requested
    schema: schemas/payload/question.requested.json
    subject_class: thread
    durability: jetstream
    trust_domains: [tenant]
    capabilities: [interaction.request]

  - type: question.resolved
    schema: schemas/payload/question.resolved.json
    subject_class: thread
    durability: jetstream
    trust_domains: [tenant, saas-attested]
    capabilities: [interaction.resolve]

  # The read pair. query.issue and query.serve are new tokens rather than the
  # command ones, so a key may be allowed to ask without being allowed to act —
  # which is the whole of what a viewer, a dashboard, or an auditor needs.
  #
  # saas-attested may ask, as it may issue a command, because a service reading
  # on behalf of a person it authenticated is the same arrangement. Only the
  # tenant may answer: an attested service is not the deployment and cannot
  # speak for its database.
  - type: query.request
    schema: schemas/payload/query.request.json
    subject_class: conductor_query
    durability: core
    trust_domains: [tenant, saas-attested]
    capabilities: [query.issue]

  - type: query.result
    schema: schemas/payload/query.result.json
    subject_class: conductor_query_result
    durability: core
    trust_domains: [tenant]
    capabilities: [query.serve]

  # The tool pair is the thread timeline's evidence: what an agent actually did,
  # and what a permission gate gated. Agent-emitted thread content, so it carries
  # thread.write like the other agent-emitted thread events. A new capability
  # token would have to be granted by every existing delegation before an agent
  # could record a tool call at all, which is not an additive change.
  - type: tool.call
    schema: schemas/payload/tool.call.json
    subject_class: thread
    durability: jetstream
    trust_domains: [tenant]
    capabilities: [thread.write]

  - type: tool.result
    schema: schemas/payload/tool.result.json
    subject_class: thread
    durability: jetstream
    trust_domains: [tenant]
    capabilities: [thread.write]
